name: Build V13 Client

on:
  push:
    branches:
      - chatgpt-build-v13-client

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Worker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          dotnet publish .\ToolTikTokWorkerV13\ToolTikTokWorkerV13.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -o .\publish

      - name: Publish Manager
        shell: pwsh
        run: |
          dotnet publish .\ToolTikTokManagerV13\ToolTikTokManagerV13.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -o .\publish

      - name: Prepare portable package
        shell: pwsh
        run: |
          Get-ChildItem .\publish -Recurse -Filter *.pdb | Remove-Item -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\publish\TikTokProfiles | Out-Null
          New-Item -ItemType Directory -Force -Path .\publish\profiles | Out-Null
          '@echo off`r`ncd /d "%~dp0"`r`nstart "" ".\ToolTikTokManagerV13.exe"`r`n' | Set-Content -Encoding ascii .\publish\CHAY_TOOL_V13_4.bat
          @'
TOOL TIKTOK V13.4.1 - WINDOWS X64 PORTABLE
- Khong can cai .NET 8.
- Khong can Tesseract/OCR.
- Can Google Chrome.
- Chay CHAY_TOOL_V13_4.bat hoac ToolTikTokManagerV13.exe.
- Chrome profile: TikTokProfiles\ten_profile\chrome_profile
'@ | Set-Content -Encoding utf8 .\publish\README_MAY_KHACH.txt

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolTikTok_V13.4.1_CLIENT_WIN_X64
          path: publish/**
          if-no-files-found: error
          compression-level: 6
