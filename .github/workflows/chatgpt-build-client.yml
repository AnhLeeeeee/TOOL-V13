name: Build latest user V13 worker

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-build-client-latest-user-20260814-src

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate latest worker source
        shell: pwsh
        run: |
          $parts = @('.\.builddelta\chunk_00.txt','.\.builddelta\chunk_01.txt','.\.builddelta\chunk_02.txt','.\.builddelta\chunk_03_04.txt','.\.builddelta\chunk_05_06.txt','.\.builddelta\chunk_07_08.txt','.\.builddelta\chunk_09_10.txt','.\.builddelta\chunk_11_12.txt','.\.builddelta\chunk_13_14.txt','.\.builddelta\chunk_15_16.txt')
          $b64 = ($parts | ForEach-Object { Get-Content -Raw $_ }) -join ''
          $zip = '.\.builddelta\latest_delta_worker.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          Expand-Archive -Path $zip -DestinationPath . -Force
      - name: Overlay exact page recovery source
        shell: pwsh
        run: Expand-Archive -Path .\.buildpatch\page_recovery_exact_sources.zip -DestinationPath . -Force
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Worker
        shell: pwsh
        run: dotnet publish .\ToolTikTokWorkerV13\ToolTikTokWorkerV13.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -o .\worker_publish
      - uses: actions/upload-artifact@v4
        with:
          name: ToolTikTok_V13.4.1_PAGE_RECOVERY_30MIN_WORKER_WIN_X64
          path: worker_publish/**
