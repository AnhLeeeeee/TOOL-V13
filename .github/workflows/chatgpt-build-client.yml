name: Build latest user V13 client

on:
  push:
    branches:
      - chatgpt-build-client-latest-user-20260814-src

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate exact user source delta
        shell: pwsh
        run: |
          $parts = @(
            '.\.builddelta\chunk_00.txt',
            '.\.builddelta\chunk_01.txt',
            '.\.builddelta\chunk_02.txt',
            '.\.builddelta\chunk_03_04.txt',
            '.\.builddelta\chunk_05_06.txt',
            '.\.builddelta\chunk_07_08.txt',
            '.\.builddelta\chunk_09_10.txt',
            '.\.builddelta\chunk_11_12.txt',
            '.\.builddelta\chunk_13_14.txt',
            '.\.builddelta\chunk_15_16.txt'
          )
          $b64 = ($parts | ForEach-Object { Get-Content -Raw $_ }) -join ''
          $zip = '.\.builddelta\latest_delta_fixed.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2eac464efbd571e5a2087de8f3b69b0726aed05f90f078021703fd712c7f3a28') {
            throw "Delta SHA256 mismatch: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath . -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Worker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          dotnet publish .\ToolTikTokWorkerV13\ToolTikTokWorkerV13.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -o .\publish

      - name: Publish Manager
        shell: pwsh
        run: |
          dotnet publish .\ToolTikTokManagerV13\ToolTikTokManagerV13.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:PublishTrimmed=false -o .\publish

      - name: Prepare clean portable client
        shell: pwsh
        run: |
          Get-ChildItem .\publish -Recurse -Filter *.pdb | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item .\publish\TikTokProfiles -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\publish\profiles -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\publish\profiles.json -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .\publish\TikTokProfiles | Out-Null
          New-Item -ItemType Directory -Force -Path .\publish\profiles | Out-Null
          $bat = @('@echo off','cd /d "%~dp0"','start "" ".\ToolTikTokManagerV13.exe"')
          $bat | Set-Content -Encoding ascii .\publish\CHAY_TOOL_V13_4.bat
          $readme = @(
            'TOOL TIKTOK V13.4.1 - CLIENT SACH - WINDOWS X64',
            '- Khong kem profile/config cu.',
            '- Khong can cai .NET 8.',
            '- Khong can Tesseract/OCR.',
            '- Can Google Chrome.',
            '- Chay CHAY_TOOL_V13_4.bat hoac ToolTikTokManagerV13.exe.'
          )
          $readme | Set-Content -Encoding utf8 .\publish\README_MAY_KHACH.txt

      - name: Upload clean client
        uses: actions/upload-artifact@v4
        with:
          name: ToolTikTok_V13.4.1_CLIENT_CLEAN_NO_REPEAT_WIN_X64
          path: publish/**
          if-no-files-found: error
          compression-level: 6
